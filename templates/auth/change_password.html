{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block topbar_title %}Change Password{% endblock %}
{% block sidebar %}{% endblock %}
{% block content %}
<div class="card" style="max-width:480px;margin:0 auto">
  <div class="card-header"><div class="card-title"><div class="ct-icon">🔒</div>Update your password</div></div>
  <div class="card-body">
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group"><label>Current password</label><input class="input" type="password" name="current_password" required></div>
      <div class="form-group"><label>New password</label><input class="input" type="password" name="new_password" required minlength="8"></div>
      <div class="form-group"><label>Confirm new password</label><input class="input" type="password" name="confirm_password" required minlength="8"></div>
      <button type="submit" class="btn btn-primary">Update password</button>
    </form>
  </div>
</div>
{% endblock %}
